<!doctype html>
<!-- Source for src/assets/og-image.png, the 1200 x 630 picture a shared newportsg.com link carries.
     Layout and colours follow the Newport Brand Book's share-image template.
     To regenerate, open this file at exactly 1200 x 630 and capture it, e.g.
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=src/assets/og-image.png docs/og-image.html
     Keep the headline in step with the home page hero in src/content.js. -->
<meta charset="utf-8">
<title>newportsg.com share image</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../src/assets/fonts/inter-var.woff2") format("woff2"); }
  html, body { margin: 0; }
  .art { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0a1124; color: #e7ebf2;
         font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .pad { position: absolute; inset: 0; padding: 64px; z-index: 1; }
  .logo { display: block; height: 136px; width: auto; }
  .label { margin: 40px 0 0; font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #39b5eb; }
  .headline { margin: 18px 0 0; max-width: 760px; font-size: 62px; line-height: 1.08; font-weight: 700; letter-spacing: -.02em; }
  .swell { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 264px; display: block; }
  .swell path { stroke: #0a1124; stroke-width: 7; }
</style>
<div class="art">
  <div class="pad">
    <img class="logo" src="../src/assets/logo-white@2x.png" alt="Newport Search Group">
    <p class="label">The AI-native recruiting platform</p>
    <p class="headline">The future of hiring is<br>AI&#8209;native</p>
  </div>
  <svg class="swell" viewBox="0 0 1080 360" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#8dd4f5" d="M-10 262 C 330 262 560 60 1090 34 V370 H-10 Z"/>
    <path fill="#39b5eb" d="M-10 292 C 340 292 590 120 1090 100 V370 H-10 Z"/>
    <path fill="#0570c3" d="M-10 322 C 350 322 620 190 1090 172 V370 H-10 Z"/>
    <path fill="#0460ac" d="M-10 350 C 360 350 650 268 1090 252 V370 H-10 Z"/>
  </svg>
</div>
