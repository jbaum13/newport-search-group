name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # /jobs and the per-job pages are built from the Manatal career page
  # (src/jobs-feed.js), so rebuild hourly to pick up new and closed roles.
  # Run it by hand from the Actions tab to publish a new job immediately.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

# Allow the workflow to publish to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Detects the correct base path for this Pages site (project sub-path,
      # or "" when a custom domain / user site serves from root)
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: node build.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Fail rather than publish a /jobs with no roles if Manatal is down;
          # Pages keeps serving the last good deploy until the next run.
          JOBS_FEED_REQUIRED: "1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
